services:
  postgres:
    container_name: ${CONTAINER_PREFIX:-tfm}-postgres
    image: postgres:18
    restart: unless-stopped
    labels:
      com.observability.stack: ${COMPOSE_PROJECT_NAME:-tennis-platform}
      com.observability.service: "${CONTAINER_PREFIX:-tfm}-postgres"
      com.observability.role: "database"
    ports:
      - "${DB_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${DB_NAME:-demo-tfm}
      POSTGRES_USER: ${DB_USER:-postgres-tfm}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres-tfm} -d ${DB_NAME:-demo-tfm}"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - default
      - app-network

  backend:
    image: ${DOCKER_USERNAME:-ismeh}/tennis-backend:latest
    pull_policy: always
    container_name: ${CONTAINER_PREFIX:-tfm}-backend
    restart: unless-stopped
    labels:
      com.observability.stack: ${COMPOSE_PROJECT_NAME:-tennis-platform}
      com.observability.service: "${CONTAINER_PREFIX:-tfm}-backend"
      com.observability.role: "backend"
      prometheus.scrape: "true"
      prometheus.port: "${BACKEND_PORT:-8080}"
      prometheus.path: "/actuator/prometheus"
    ports:
      - "${BACKEND_PORT:-8080}:${BACKEND_PORT:-8080}"
    environment:
      - BACKEND_PORT=${BACKEND_PORT:-8080}
      - BACKEND_PROFILE=${BACKEND_PROFILE:-dev}
      - SPRING_PROFILES_ACTIVE=${BACKEND_PROFILE:-dev}
      - DATASOURCE_URL=${DATASOURCE_URL:-jdbc:postgresql://postgres:5432/demo-tfm}
      - DB_USER=${DB_USER:-postgres-tfm}
      - DB_PASSWORD=${DB_PASSWORD:-secret}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-my_very_secret_and_long_key_for_tennis_platform_tfm_project}
      - EMAIL_CONFIRMATION_REQUIRED=${EMAIL_CONFIRMATION_REQUIRED:-true}
      - EMAIL_CONFIRMATION_ENABLED=${EMAIL_CONFIRMATION_ENABLED:-false}
      - EMAIL_FROM=${EMAIL_FROM:-no-reply@tennis-platform.local}
      - FRONTEND_CONFIRMATION_URL=${FRONTEND_CONFIRMATION_URL:-http://localhost:4200/confirmar-email}
      - EMAIL_CONFIRMATION_TOKEN_EXPIRATION_MINUTES=${EMAIL_CONFIRMATION_TOKEN_EXPIRATION_MINUTES:-1440}
      - MAIL_HOST=${MAIL_HOST:-}
      - MAIL_PORT=${MAIL_PORT:-587}
      - MAIL_USERNAME=${MAIL_USERNAME:-}
      - MAIL_PASSWORD=${MAIL_PASSWORD:-}
      - MAIL_SMTP_AUTH=${MAIL_SMTP_AUTH:-true}
      - MAIL_SMTP_STARTTLS_ENABLE=${MAIL_SMTP_STARTTLS_ENABLE:-true}
      - SPRING_FLYWAY_BASELINE_ON_MIGRATE=${FLYWAY_BASELINE_ON_MIGRATE:-true}
      - SPRING_FLYWAY_BASELINE_VERSION=${FLYWAY_BASELINE_VERSION:-0}
      - PRO_PLAYERS_IMPORT_ENABLED=${PRO_PLAYERS_IMPORT_ENABLED:-false}
      - PRO_PLAYERS_IMPORT_RUN_ON_STARTUP=${PRO_PLAYERS_IMPORT_RUN_ON_STARTUP:-false}
      - PRO_PLAYERS_IMPORT_CRON=${PRO_PLAYERS_IMPORT_CRON:-0 0 4 * * MON}
      - PRO_PLAYERS_IMPORT_BATCH_SIZE=${PRO_PLAYERS_IMPORT_BATCH_SIZE:-1000}
      - PRO_PLAYERS_MALE_CSV_LOCATION=${PRO_PLAYERS_MALE_CSV_LOCATION:-classpath:db/seed/pro_players_male.csv}
      - PRO_PLAYERS_FEMALE_CSV_LOCATION=${PRO_PLAYERS_FEMALE_CSV_LOCATION:-classpath:db/seed/pro_players_female.csv}
      - GOOGLE_MAPS_API_KEY=${GOOGLE_MAPS_API_KEY:-}
      - GOOGLE_PLACES_BASE_URL=${GOOGLE_PLACES_BASE_URL:-https://places.googleapis.com}
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY:-}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY:-}
      - VAPID_SUBJECT=${VAPID_SUBJECT:-mailto:no-reply@puntomatch.local}
      - VAPID_TTL_SECONDS=${VAPID_TTL_SECONDS:-86400}
      - OTEL_EXPORTER_OTLP_TRACES_ENDPOINT=${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-http://tempo:4318/v1/traces}
      - MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-http://tempo:4318/v1/traces}
      - MANAGEMENT_OTLP_METRICS_EXPORT_ENABLED=false
      - MANAGEMENT_OPENTELEMETRY_LOGGING_EXPORT_OTLP_ENABLED=false
      - OTEL_TRACES_SAMPLER_ARG=${OTEL_TRACES_SAMPLER_ARG:-1.0}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - default
      - app-network
  
  frontend:
    image: ${DOCKER_USERNAME:-ismeh}/tennis-frontend:latest
    pull_policy: always
    container_name: ${CONTAINER_PREFIX:-tfm}-frontend
    restart: unless-stopped
    labels:
      com.observability.stack: ${COMPOSE_PROJECT_NAME:-tennis-platform}
      com.observability.service: "${CONTAINER_PREFIX:-tfm}-frontend"
      com.observability.role: "frontend"
    ports:
      - "${FRONTEND_PORT:-4200}:4000"
    environment:
      - PORT=4000
      - NODE_ENV=production
      - API_URL=${FRONTEND_API_URL:-http://backend:${BACKEND_PORT:-8080}/api}
      - PUBLIC_API_URL=${FRONTEND_PUBLIC_API_URL:-http://localhost:${BACKEND_PORT:-8080}/api}
      - PRODUCTION=true
      - NG_ALLOWED_HOSTS=${FRONTEND_ALLOWED_HOSTS:-localhost,127.0.0.1,tfm-frontend,frontend,puntomatch.istr.es}
    depends_on:
      - backend
    networks:
      - default
      - app-network

networks:
  default:
    driver: bridge
  app-network:
    external: true

volumes:
  postgres_data:
